name: CVEarity SBOM Discovery
'on':
  repository_dispatch:
    types:
    - cvearity_sbom_scan
    - cvearity_iac_bom_scan
    - cvearity_ai_bom_scan
  push:
    branches:
    - main
    - master
  workflow_dispatch:
    inputs:
      api_url:
        description: CVEarity API URL
        required: false
        type: string
      upload_token:
        description: Upload Token (scan_id:token)
        required: false
        type: string
      scan_id:
        description: Scan ID
        required: false
        type: string
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.client_payload.branch || github.ref }}
    - name: Run CVEarity Discovery Agent
      env:
        CVEARITY_API_URL: ${{ github.event.client_payload.api_url || github.event.inputs.api_url
          || secrets.CVEARITY_API_URL }}
        CVEARITY_UPLOAD_TOKEN: ${{ github.event.client_payload.upload_token || github.event.inputs.upload_token
          || secrets.CVEARITY_UPLOAD_TOKEN }}
      run: "SCAN_ID=\"${{ github.event.client_payload.scan_id || github.event.inputs.scan_id\
        \ || 'auto' }}\"\ndocker run --rm \\\n  -v ${{ github.workspace }}:/workspace\
        \ \\\n  -e CVEARITY_API_URL \\\n  -e CVEARITY_UPLOAD_TOKEN \\\n  -e UPLOAD_TOKEN=\"\
        $CVEARITY_UPLOAD_TOKEN\" \\\n  prasad2374/cvearitybom:latest \\\n  --type\
        \ sbom \\\n  --scan-id \"$SCAN_ID\" \\\n  --source /workspace\n"
